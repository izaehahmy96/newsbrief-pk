name: Update news
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: update-news
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect and rewrite news
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python3 pipeline.py
      - name: Save news.json
        run: |
          git config user.name "newsbrief-bot"
          git config user.email "bot@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || (git commit -m "Update news" && git push)
