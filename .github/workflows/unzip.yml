name: Unpack app files
on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack any zip in the main folder
        run: |
          set -e
          for z in *.zip; do
            [ -f "$z" ] || continue
            rm -rf _tmp && mkdir _tmp
            unzip -q "$z" -d _tmp
            top=$(ls _tmp | head -n1)
            rsync -a --exclude='.github' "_tmp/$top/" ./
            rm -f "$z"
          done
          rm -rf _tmp
      - name: Save
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Unpack app files"
          git push
